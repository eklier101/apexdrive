name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(node -e "const p='$VERSION'.split('.').map(Number); console.log(p[0]*10000+p[1]*100+(p[2]||0))")
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client
        run: npx cap sync android

      - name: Build APK
        working-directory: client/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Stage APK for release
        run: |
          mkdir -p data/apks
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "data/apks/apexdrive_v${{ steps.ver.outputs.version }}.apk"
          cp client/android/app/build/outputs/apk/debug/app-debug.apk data/apks/apexdrive_latest.apk
          mkdir -p server/data/apks
          cp "data/apks/apexdrive_v${{ steps.ver.outputs.version }}.apk" "server/data/apks/apexdrive_v${{ steps.ver.outputs.version }}.apk"
          cp data/apks/apexdrive_latest.apk server/data/apks/apexdrive_latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: data/apks/apexdrive_v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
